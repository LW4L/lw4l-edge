function line(a,col,id){const w=400,h=170,mn=Math.min(...a),mx=Math.max(...a),pt=a.map((v,i)=>[i/(a.length-1)*w,h-8-(mx==mn?.5:(v-mn)/(mx-mn))*(h-16)]);const d=pt.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');

pair:()=>{const i=sym(cur),n={'1H':60,'4H':48,'1D':96,'7D':84,'30D':90}[tf],a=series(i[3]*7%999+tf.length,n,i[3]*.97,.012,.0004);a[n-1]=i[3];window._a=a;const up=i[4]>=0,col=up?'#22c17a':'#ff4d52',d=dec(i[3]);
return `<div class="top"><button class="ib" onclick="go('fav')" aria-label="Back">${ic('back',20)}</button><div style="flex:1"><h1 style="font-size:26px">${i[0]}</h1><small class="m">${i[1]}</small></div><button class="star ${fav.has(cur)?'on':''}" onclick="tog('${cur}')">${ic('star',22)}</button></div>
<div class="card"><span class="live demo">DEMO DATA</span> <span class="m" style="font-size:12px">live feed appears here once connected</span><div class="big" id="px" style="font-size:44px;margin-top:6px">${i[3].toFixed(d)}</div><b class="${cl(i[4])}">${i[4]>0?'+':''}${i[4]}% today</b>
<div id="chart" style="margin:10px 0">${line(a,col,'p1')}</div><div class="chips" style="margin:0">${['1H','4H','1D','7D','30D'].map(t=>`<button class="chip ${t==tf?'on':''}" onclick="tf='${t}';render()">${t}</button>`).join('')}</div></div>

async function saveTrade(){if(!USER||MODE=='demo')return;const m=$('#svm'),n=x=>(x===undefined||x===''||x===null)?null:parseFloat(x),ins=INS.find(i=>i[0]==AT.sym);
if(!ins)return m.textContent='Pick a pair first.';
const entry=n(AT.entry),pnl=n(AT.pnl),risk=n(AT.risk);
if(!(entry>0))return m.textContent='Enter the entry price.';
if(pnl==null||isNaN(pnl))return m.textContent='Enter the result (profit or loss).';
if(risk!=null&&!(risk>0))return m.textContent='Risk amount must be above 0.';
$('#sv').disabled=true;m.textContent='Saving...';
try{let sid=null;if(AT.strat){const q=await SB.from('strategies').select('id').eq('name',AT.strat).maybeSingle();if(q.error)throw q.error;if(q.data)sid=q.data.id;else{const i=await SB.from('strategies').insert({name:AT.strat}).select('id').single();if(i.error)throw i.error;sid=i.data.id}}
const at=AT.at?new Date(AT.at).toISOString():new Date().toISOString();
const r=await SB.from('trades').insert({instrument_id:ins[5],side:AT.side,entry_price:entry,exit_price:n(AT.exit),stop_loss:n(AT.stop),take_profit:n(AT.tp),position_size:n(AT.size),risk_amount:risk,risk_pct:(risk&&PROF.account_balance)?+(risk/PROF.account_balance*100).toFixed(2):null,pnl,session:AT.session||null,strategy_id:sid,notes:AT.notes||null,emotion:AT.emo||null,mistakes:AT.mis,opened_at:at,closed_at:at});
if(r.error)throw r.error;
AT={side:'long',session:'',strat:'',emo:'',mis:[]};await loadTrades();go('journal')}
catch(e){m.textContent=e.message||'Could not save. Try again.';const b=$('#sv');if(b)b.disabled=false}}
function pickPair(s){AT.sym=s;PICK=false;closeS();render()}
function rex(){const a=$('#ab'),r=$('#ar'),e=$('#rx');if(!e)return;const b=parseFloat(a&&a.value),p=parseFloat(r&&r.value);e.textContent=(b>0&&p>0)?`At ${p}% on ${money(b)}, you risk ${money(b*p/100)} per trade.`:'Enter your account size and risk % to see an example.'}
SB.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY'){const p=prompt('Choose a new password (8+ characters)');if(p&&p.length>=8)SB.auth.updateUser({password:p}).then(r=>alert(r.error?r.error.message:'Password updated.'))}});
SB.auth.getSession().then(({data})=>{if(data.session)onSession(data.session)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
